name: build

# build on c/cpp changes or workflow changes
on:
  - push
  - pull_request

jobs:

  linux-sdl-gl3:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -qyy g++ cmake libsdl2-dev libpng-dev libjpeg-dev zlib1g-dev xvfb

      - name: Build
        run: |
          cmake . -DUSE_SDL2=1 -DUSE_SDL3=0 -DENABLE_OPENGL=0 -DENABLE_OPENGL3=1 -DBUILD_EXAMPLES=1
          make -j2

      - name: Test (headless)
        run: |
          cd bin/Linux
          ./AutomatedTest null

      - name: Test (Xvfb)
        run: |
          cd bin/Linux
          LIBGL_ALWAYS_SOFTWARE=true xvfb-run ./AutomatedTest opengl3

      - name: Package
        run: |
          make DESTDIR=$PWD/_install install
          tar -c -I "gzip -9" -f irrlicht-linux.tar.gz -C ./_install/usr/local .

      - uses: actions/upload-artifact@v4
        with:
          name: irrlicht-linux
          path: ./irrlicht-linux.tar.gz

  linux-sdl-gles2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -qyy g++ cmake libsdl2-dev libpng-dev libjpeg-dev zlib1g-dev xvfb

      - name: Build
        run: |
          cmake . -DUSE_SDL2=1 -DUSE_SDL3=0 -DENABLE_OPENGL=0 -DENABLE_GLES2=1 -DBUILD_EXAMPLES=1
          make -j2

      - name: Test (headless)
        run: |
          cd bin/Linux
          ./AutomatedTest null

      - name: Test (Xvfb)
        run: |
          cd bin/Linux
          LIBGL_ALWAYS_SOFTWARE=true xvfb-run ./AutomatedTest ogles2

  macos-sdl:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install deps
        run: |
          brew update --auto-update
          brew install cmake libpng jpeg sdl2
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1

      - name: Build
        run: |
          cmake . -DUSE_SDL2=1 -DUSE_SDL3=0 -DCMAKE_FIND_FRAMEWORK=LAST -DBUILD_EXAMPLES=1
          make -j3

  msvc-2026:
    runs-on: windows-latest
    env:
      VCPKG_VERSION: 9e593bb18ea69cc5095e012465dcd675a822ed0d
      vcpkg_packages: zlib libpng libjpeg-turbo
    strategy:
      fail-fast: false
      matrix:
        config:
          -
            generator: "-G'Visual Studio 18 2026' -A x64"
            vcpkg_triplet: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore from cache and run vcpkg
        uses: lukka/run-vcpkg@v7
        with:
          vcpkgArguments: zlib libpng libjpeg-turbo sdl2
          vcpkgDirectory: '${{ github.workspace }}\vcpkg'
          appendedCacheKey: ${{ matrix.config.vcpkg_triplet }}
          vcpkgGitCommitId: ${{ env.VCPKG_VERSION }}
          vcpkgTriplet: ${{ matrix.config.vcpkg_triplet }}

      - name: CMake
        run: |
            cmake ${{matrix.config.generator}}  `
            -DUSE_SDL2=1 -DUSE_SDL3=0 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake"  `
            -DCMAKE_BUILD_TYPE=Release .

      - name: Build
        run: cmake --build . --config Release

      - name: Create artifact folder
        run: |
          mkdir artifact/
          mkdir artifact/lib/

      - name: Move dlls into artifact folder
        run: move bin\Win32-VisualStudio\Release\* artifact\lib\

      - name: Move includes into artifact folder
        run: move include artifact/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msvc-${{ matrix.config.vcpkg_triplet }}
          path: artifact/

  android:
    # TODO: Fix "Error: The operation was canceled."
    if: false
    name: Android ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    env:
       # https://github.com/android/ndk/releases
       ndk_version: "r27d"
       ANDROID_NDK: ${{ github.workspace }}/android-ndk
    strategy:
      matrix:
        arch: [armeabi-v7a, arm64-v8a, x86, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -qyy wget unzip zip gcc-multilib make cmake

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          key: android-ndk-${{ env.ndk_version }}-linux
          path: ${{ env.ANDROID_NDK }}

      - name: Install NDK
        run: |
          wget "http://dl.google.com/android/repository/android-ndk-${ndk_version}-linux.zip"
          unzip -q "android-ndk-${ndk_version}-linux.zip"
          rm "android-ndk-${ndk_version}-linux.zip"
          mv "android-ndk-${ndk_version}" "${ANDROID_NDK}"
        if: ${{ steps.cache-ndk.outputs.cache-hit != 'true' }}

      - name: Build
        run: ./scripts/ci-build-android.sh ${{ matrix.arch }}

      #- name: Upload Artifact
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: irrlicht-android-${{ matrix.arch }}
      #    path: ${{ runner.temp }}/pkg/${{ matrix.arch }}
